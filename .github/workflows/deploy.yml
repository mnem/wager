name: Deploy

# The published site is the contents of src/ copied verbatim, plus a generated
# version.js. There is no build step — see CLAUDE.md.
#
# Deliberately NOT triggered by `release: [published]`. Releases created with
# GITHUB_TOKEN do not trigger further workflows, so such a deploy would never
# fire. release.yml calls this workflow directly instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch or tag to deploy. Defaults to the triggering commit.'
        type: string
        required: false
        default: ''
      version:
        description: 'Version to show in the footer. Defaults to git describe.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One global group, so a release deploy can never race a push deploy. A
  # single group is deliberate: two concurrent deploys would be last-one-wins,
  # and "whichever finished last" is not a property worth having.
  #
  # Known limitation, accepted rather than solved: a concurrency group holds at
  # most ONE pending run. If a deploy is running, a release deploy is pending,
  # and another push to main lands, the pending release deploy is cancelled
  # rather than queued — leaving the site on main rather than the tag. It needs
  # two triggers inside one deploy's runtime, it fails visibly in the Actions
  # tab, and re-running the release workflow fixes it. Giving releases their own
  # group would trade this for genuine concurrent deploys, which is worse.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Needed for `git describe` to find the most recent tag.
          fetch-depth: 0

      - name: Stage the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R src/. _site/
          test -f _site/index.html || { echo "::error::src/index.html is missing"; exit 1; }

      - name: Generate build metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%MZ)"

          # A release passes its tag in. A push to main describes itself
          # relative to the last tag, e.g. v1.2.0-3-gabc1234.
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi

          # Refuse anything that is not a plain version string. Tags are the
          # only attacker-influenced input here, and a bad one must stop the
          # deploy with a legible error rather than reach the generator.
          case "$VERSION" in
            '' | *[!A-Za-z0-9._+-]*)
              # Strip newlines before echoing the rejected value: workflow
              # command parsing is line-based, so a tag containing a newline
              # could otherwise spoof an extra log line on its way out.
              SAFE="$(printf '%s' "$VERSION" | tr -d '\n\r' | cut -c1-80)"
              echo "::error::Refusing to deploy: version string contains unexpected characters: ${SAFE}"
              exit 1
              ;;
          esac

          # Built with JSON.stringify rather than shell interpolation into a
          # quoted JS literal.
          #
          # This file is imported by app.js, so anything that lands in it runs
          # in every visitor's browser. Splicing a raw string into '...' meant a
          # tag containing a single quote could close the literal and append
          # arbitrary JavaScript — and `node --check` would pass it, because the
          # result is still syntactically valid. Escaping is now structural
          # rather than a matter of the input being well behaved; the check
          # above is a second line of defence, not the only one.
          #
          # Overwrites the committed dev stub. The stub itself must stay a stub.
          VERSION="$VERSION" COMMIT="$COMMIT" COMMIT_SHORT="$COMMIT_SHORT" \
          REPO="$REPO" BUILT_AT="$BUILT_AT" \
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { VERSION, COMMIT, COMMIT_SHORT, REPO, BUILT_AT } = process.env;
            const build = {
              version: VERSION,
              commit: COMMIT,
              commitShort: COMMIT_SHORT,
              repo: REPO,
              builtAt: BUILT_AT,
            };
            writeFileSync(
              "_site/version.js",
              "/* Generated by .github/workflows/deploy.yml. Do not edit. */\n" +
                `export const BUILD = Object.freeze(${JSON.stringify(build, null, 2)});\n`,
            );
          '

          echo "Deploying ${VERSION} (${COMMIT_SHORT})"

      - name: Check the generated metadata is valid
        run: |
          # A syntax error here would break the whole page, since app.js
          # imports it. Cheaper to catch now than in production.
          node --check _site/version.js
          node --input-type=module -e "
            import { BUILD } from './_site/version.js';
            const required = ['version', 'commit', 'commitShort', 'repo', 'builtAt'];
            for (const key of required) {
              if (!BUILD[key]) throw new Error('version.js is missing ' + key);
            }
            if (!/^[0-9a-f]{40}\$/.test(BUILD.commit)) throw new Error('commit is not a full SHA');
            console.log('version.js looks right:', JSON.stringify(BUILD));
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
