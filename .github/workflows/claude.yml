name: Claude Code

# Responds when someone mentions @claude on an issue, a pull request comment,
# or a review. Requires the Claude GitHub App to be installed on this repository
# and a CLAUDE_CODE_OAUTH_TOKEN repository secret (generated by running
# `claude setup-token`). Swap the input below for `anthropic_api_key` with an
# ANTHROPIC_API_KEY secret to bill through the API instead.
#
# Note: a comment posted by a workflow using GITHUB_TOKEN will NOT trigger this
# workflow — GitHub does not fire workflows from GITHUB_TOKEN events. Review
# requests must be posted by a person (or by a contributor using their own auth).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
