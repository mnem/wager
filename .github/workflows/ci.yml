name: CI

on:
  # Every pull request, whatever it targets. Filtering on `branches: [main]`
  # matches the BASE branch, so a stacked pull request — one based on another
  # feature branch rather than main — would get no CI signal at all until it
  # was retargeted. Tests are cheap; run them on everything.
  pull_request:
  push:
    branches: [main]
  # Callable so the release workflow can gate on exactly the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow differs when called from another workflow, so a release's
  # CI run never cancels a push's CI run for the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Deliberately no `cache: npm` — this project has no dependencies and
          # no lockfile, so there is nothing to install or cache. See CLAUDE.md.

      - name: Run tests
        # Glob rather than a bare `test/` directory: Node 26 no longer accepts
        # a directory argument here and tries to load it as a module.
        run: node --test --test-reporter=spec "test/**/*.test.js"

      - name: Guard against personal information in published files
        run: |
          # Everything under src/ is served publicly. This is a safety net for
          # the never-commit rules in CLAUDE.md, not a substitute for care.
          if grep -rInE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}' src/; then
            echo "::error::Email-shaped string found under src/ — see the never-commit rules in CLAUDE.md"
            exit 1
          fi
          echo "No email-shaped strings under src/"

      - name: Guard against the tax-rate runbook drifting from the config
        run: |
          # docs/updating-tax-rates.md restates the 2026/27 bands as a worked
          # example, because showing the derivation teaches the gross-to-taxable
          # conversion far better than prose does. That makes it a second copy
          # of the most dangerous data in the repo, so it is checked rather than
          # trusted to be kept in step by hand.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { getTaxYear } from "./src/lib/tax-years.js";

            const doc = readFileSync("docs/updating-tax-rates.md", "utf8");
            const year = getTaxYear("2026-27");

            // Rows look like:
            // | Starter | 19% | £12,571 – £16,537 | `1900` | `396_700` |
            const rows = [...doc.matchAll(
              /^\|\s*(\w[\w\s]*?)\s*\|\s*(\d+)%\s*\|[^|]*\|\s*`(\d+)`\s*\|\s*`([\d_]+|Infinity)`\s*\|/gm,
            )];

            if (rows.length !== year.incomeTax.bands.length) {
              throw new Error(
                `The worked example has ${rows.length} bands, tax-years.js has ${year.incomeTax.bands.length}`,
              );
            }

            rows.forEach(([, label, percent, basisPoints, limit], index) => {
              const band = year.incomeTax.bands[index];
              const expectedLimit = band.upToPence === Infinity ? "Infinity" : String(band.upToPence);
              const documentedLimit = limit.replaceAll("_", "");

              if (Number(basisPoints) !== band.rateBasisPoints) {
                throw new Error(`${label}: doc says ${basisPoints} basis points, config says ${band.rateBasisPoints}`);
              }
              if (Number(percent) * 100 !== band.rateBasisPoints) {
                throw new Error(`${label}: doc says ${percent}%, which is not ${band.rateBasisPoints} basis points`);
              }
              if (documentedLimit !== expectedLimit) {
                throw new Error(`${label}: doc says upToPence ${limit}, config says ${expectedLimit}`);
              }
            });

            console.log(`Runbook worked example matches tax-years.js across ${rows.length} bands`);
          '

      - name: Guard against runtime dependencies
        run: |
          # The site must load nothing from the network. Catch the obvious ways
          # that constraint gets broken.
          #
          # The trailing (non-alphanumeric|end) after the extension matters: the
          # UI links to gov.uk and gov.scot sources, and without it a URL ending
          # .json would match on its ".js" and fail the build.
          if grep -rInE 'https?://[^"'"'"' )]*\.(js|css)([^A-Za-z0-9]|$)|<script[^>]+src="https?:|@import[[:space:]]+url\([[:space:]]*["'"'"']?https?:' src/; then
            echo "::error::src/ appears to reference a remote asset — the site must be fully self-contained. See CLAUDE.md"
            exit 1
          fi
          if [ -d node_modules ] || [ -f package-lock.json ]; then
            echo "::error::This project has no dependencies by design. See CLAUDE.md"
            exit 1
          fi
          echo "No remote assets or dependencies"
